name: Linux distribution smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Publish distribution binary
        run: bash scripts/build-release.sh --version 1.0.0-smoke --rid "${{ matrix.rid }}" --publish-only

      - name: Upload smoke payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-${{ matrix.rid }}
          path: artifacts/stage/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 3

  distribution-smoke:
    name: ${{ matrix.name }} / ${{ matrix.platform }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:13-slim
            platform: linux/amd64
            rid: linux-x64
            family: apt
          - name: Ubuntu
            image: ubuntu:24.04
            platform: linux/amd64
            rid: linux-x64
            family: apt
          - name: Kali
            image: kalilinux/kali-rolling:latest
            platform: linux/amd64
            rid: linux-x64
            family: apt
          - name: Fedora
            image: fedora:42
            platform: linux/amd64
            rid: linux-x64
            family: dnf
          - name: Arch
            image: archlinux:base
            platform: linux/amd64
            rid: linux-x64
            family: pacman
          - name: Alpine
            image: alpine:3.22
            platform: linux/amd64
            rid: linux-musl-x64
            family: apk
          - name: Debian ARM64
            image: debian:13-slim
            platform: linux/arm64
            rid: linux-arm64
            family: apt
          - name: Alpine ARM64
            image: alpine:3.22
            platform: linux/arm64
            rid: linux-musl-arm64
            family: apk
    steps:
      - name: Check out smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enable cross-architecture execution
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Download distribution payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-${{ matrix.rid }}
          path: artifacts/smoke/${{ matrix.rid }}

      - name: Run clean-container smoke test
        env:
          MORSA_SMOKE_IMAGE: ${{ matrix.image }}
          MORSA_SMOKE_PLATFORM: ${{ matrix.platform }}
          MORSA_SMOKE_FAMILY: ${{ matrix.family }}
          MORSA_SMOKE_PAYLOAD: artifacts/smoke/${{ matrix.rid }}
        run: bash scripts/smoke-linux-container.sh
